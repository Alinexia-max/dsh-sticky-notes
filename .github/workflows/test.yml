name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零运行时依赖，不需要 install：四步自检全部是 node 内置模块 + 本地文件。
      - name: self-check
        run: npm test
